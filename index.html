<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Control de Consumo Lab</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1d4ed8">
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 0; background-color: #f4f6f9; color: #1e293b; height: 100vh; display: flex; flex-direction: column; user-select: none; }

    .pantalla { display: none; flex-direction: column; height: 100%; padding: 24px; justify-content: space-between; }
    .pantalla.activa { display: flex; }
    #pantalla-cantidad { background-color: #ffffff; }

    .header { text-align: center; padding-top: 8px; }
    .header h1 { font-size: 1.4rem; margin: 0; color: #0f172a; }
    .badge { display: inline-block; background: #e2e8f0; color: #334155; padding: 6px 14px; border-radius: 20px; font-weight: 600; font-size: 0.95rem; margin-top: 10px; }
    .badge.con-datos { background: #dbeafe; color: #1d4ed8; }

    .centro-accion { display: flex; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; }
    .btn-escanear {
      width: 240px; height: 240px; border-radius: 50%; border: none;
      background: linear-gradient(145deg, #2563eb, #1d4ed8); color: white;
      font-size: 1.4rem; font-weight: bold; box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      cursor: pointer; transition: transform 0.1s;
    }
    .btn-escanear:active { transform: scale(0.95); }
    .btn-escanear svg { width: 64px; height: 64px; fill: currentColor; }

    .footer-accion { padding-bottom: 6px; display: flex; flex-direction: column; gap: 10px; }
    .btn-descargar {
      width: 100%; padding: 16px; border-radius: 12px; border: 2px solid #cbd5e1;
      background: white; color: #334155; font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    .btn-descargar:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-descargar.listo { border-color: #0284c7; color: #0369a1; background: #e0f2fe; }

    .btn-respaldo {
      background: none; border: none; color: #64748b; font-size: 0.85rem;
      text-decoration: underline; padding: 6px; cursor: pointer; display: none;
    }

    .camara-contenedor { position: relative; width: 100%; flex-grow: 1; background: #000; border-radius: 16px; overflow: hidden; display: flex; align-items: center; justify-content: center; margin: 16px 0; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .guia-escaneo {
      position: absolute; width: 84%; height: 32%; border: 3px solid #22c55e;
      border-radius: 12px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55);
      display: flex; align-items: center; justify-content: center;
    }
    .linea-laser { width: 90%; height: 2px; background: rgba(239, 68, 68, 0.85); box-shadow: 0 0 8px #ef4444; }
    .btn-secundario { width: 100%; padding: 16px; border-radius: 12px; border: none; background: #e2e8f0; color: #1e293b; font-size: 1.1rem; font-weight: 600; margin-top: 8px; }

    .tarjeta-datos { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .dato-bloque { text-align: center; }
    .dato-bloque span { display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: #64748b; margin-bottom: 4px; }
    .dato-bloque strong { font-size: 1.65rem; color: #0f172a; word-break: break-all; }
    .dato-bloque.secundario strong { font-size: 1.35rem; color: #334155; }
    .divisor-tarjeta { height: 1px; background: #e2e8f0; width: 100%; }

    .control-cantidad { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 20px 0; }
    .btn-ajuste {
      width: 72px; height: 72px; border-radius: 16px; border: none;
      background: #e2e8f0; color: #0f172a; font-size: 2.2rem; font-weight: bold;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .btn-ajuste:active { background: #cbd5e1; }
    .input-cantidad {
      width: 120px; height: 72px; text-align: center; font-size: 2.2rem; font-weight: bold;
      border: 2px solid #94a3b8; border-radius: 16px; color: #0f172a;
    }

    .btn-guardar {
      width: 100%; padding: 20px; border-radius: 14px; border: none;
      background: #16a34a; color: white; font-size: 1.3rem; font-weight: bold;
      box-shadow: 0 6px 15px rgba(22, 163, 74, 0.3); cursor: pointer;
    }
    .btn-guardar:active { background: #15803d; }

    .modal-fondo {
      display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.65);
      align-items: center; justify-content: center; padding: 20px; z-index: 200;
    }
    .modal-fondo.activo { display: flex; }
    .modal-caja {
      background: white; border-radius: 18px; padding: 24px; width: 100%; max-width: 380px;
      text-align: center; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
    }
    .modal-caja h2 { margin: 0 0 10px 0; font-size: 1.25rem; color: #0f172a; }
    .modal-caja p { margin: 0 0 20px 0; font-size: 0.98rem; color: #475569; line-height: 1.4; }
    .modal-botones { display: flex; flex-direction: column; gap: 10px; }
    .btn-onedrive {
      width: 100%; padding: 16px; border-radius: 12px; border: none;
      background: #0284c7; color: white; font-size: 1.1rem; font-weight: bold; cursor: pointer;
    }

    .toast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: #0f172a; color: white; padding: 12px 24px; border-radius: 30px;
      font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 100;
    }
    .toast.visible { opacity: 1; }
  </style>
</head>
<body>

  <div id="toast" class="toast">Registro guardado</div>

  <div id="modal-confirmacion" class="modal-fondo">
    <div class="modal-caja">
      <h2 id="modal-titulo">Exportar corte a OneDrive</h2>
      <p id="modal-mensaje">Se generará el reporte y la memoria del celular volverá a 0.</p>
      <div class="modal-botones">
        <button id="btn-confirmar-envio" class="btn-onedrive">Enviar a OneDrive y Limpiar</button>
        <button class="btn-secundario" style="margin-top:0;" onclick="cerrarModal()">Cancelar</button>
      </div>
    </div>
  </div>

  <div id="pantalla-inicio" class="pantalla activa">
    <div class="header">
      <h1>Consumo de Material</h1>
      <div id="contador-badge" class="badge">0 registros pendientes</div>
    </div>

    <div class="centro-accion">
      <button class="btn-escanear" onclick="iniciarCamara()">
        <svg viewBox="0 0 24 24"><path d="M4 4h4V2H2v6h2V4zm16 0v4h2V2h-6v2h4zM4 20v-4H2v6h6v-2H4zm16-4v4h-4v2h6v-6h-2zM7 11h10v2H7v-2z"/></svg>
        Escanear
      </button>
    </div>

    <div class="footer-accion">
      <button id="btn-descargar" class="btn-descargar" onclick="abrirModalExportacion(false)" disabled>
        Guardar en OneDrive y Limpiar
      </button>
      <button id="btn-respaldo" class="btn-respaldo" onclick="abrirModalExportacion(true)">
        Reenviar último corte
      </button>
    </div>
  </div>

  <div id="pantalla-camara" class="pantalla">
    <div class="header">
      <h1>Centra el QR o Código de Barras</h1>
    </div>
    <div class="camara-contenedor">
      <video id="video" playsinline></video>
      <div class="guia-escaneo"><div class="linea-laser"></div></div>
    </div>
    <button class="btn-secundario" onclick="ingresoManual()">Escribir código manualmente</button>
    <button class="btn-secundario" style="background:#fee2e2; color:#b91c1c;" onclick="detenerCamara()">Cancelar</button>
  </div>

  <div id="pantalla-cantidad" class="pantalla">
    <div class="tarjeta-datos">
      <div class="dato-bloque">
        <span>Código de Material</span>
        <strong id="texto-material">---</strong>
      </div>
      <div class="divisor-tarjeta"></div>
      <div class="dato-bloque secundario">
        <span>Lote Interno</span>
        <strong id="texto-lote">---</strong>
      </div>
    </div>

    <div class="centro-accion">
      <label id="label-cantidad" style="font-weight: 700; color: #475569; margin-bottom: 8px;">CANTIDAD TOMADA</label>
      <div class="control-cantidad">
        <button class="btn-ajuste" onclick="ajustarCantidad(-1)">−</button>
        <input type="number" id="input-cantidad" class="input-cantidad" value="1" min="0.01" step="any" inputmode="decimal">
        <button class="btn-ajuste" onclick="ajustarCantidad(1)">+</button>
      </div>
    </div>

    <div>
      <button class="btn-guardar" onclick="guardarRegistro()">Guardar Consumo</button>
      <button class="btn-secundario" style="margin-top: 12px;" onclick="cambiarPantalla('pantalla-inicio')">Descartar</button>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js');
    }

    const STORAGE_KEY = 'lab_registros_consumo';
    const BACKUP_KEY = 'lab_ultimo_corte';

    let materialActual = '';
    let loteActual = '';
    let streamCamara = null;
    let intervaloEscaneo = null;
    let modoRespaldoActivo = false;

    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist();
    }

    actualizarInterfaz();

    function cambiarPantalla(id) {
      document.querySelectorAll('.pantalla').forEach(p => p.classList.remove('activa'));
      document.getElementById(id).classList.add('activa');
    }

    function obtenerRegistros(llave = STORAGE_KEY) {
      const datos = localStorage.getItem(llave);
      return datos ? JSON.parse(datos) : [];
    }

    function actualizarInterfaz() {
      const registros = obtenerRegistros(STORAGE_KEY);
      const respaldo = obtenerRegistros(BACKUP_KEY);
      const badge = document.getElementById('contador-badge');
      const btnDescargar = document.getElementById('btn-descargar');
      const btnRespaldo = document.getElementById('btn-respaldo');

      badge.textContent = `${registros.length} registro${registros.length === 1 ? '' : 's'} pendiente${registros.length === 1 ? '' : 's'}`;

      if (registros.length > 0) {
        badge.classList.add('con-datos');
        btnDescargar.disabled = false;
        btnDescargar.classList.add('listo');
      } else {
        badge.classList.remove('con-datos');
        btnDescargar.disabled = true;
        btnDescargar.classList.remove('listo');
      }

      if (respaldo.length > 0) {
        btnRespaldo.style.display = 'block';
        btnRespaldo.textContent = `Emergencia: Reenviar último corte (${respaldo.length} reg.)`;
      } else {
        btnRespaldo.style.display = 'none';
      }
    }

    async function iniciarCamara() {
      cambiarPantalla('pantalla-camara');
      const video = document.getElementById('video');

      try {
        streamCamara = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'environment',
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            advanced: [{ focusMode: 'continuous' }]
          }
        });
        video.srcObject = streamCamara;
        await video.play();

        if ('BarcodeDetector' in window) {
          const detector = new BarcodeDetector({
            formats: [
              'qr_code', 'code_128', 'code_39', 'code_93',
              'ean_13', 'ean_8', 'upc_a', 'upc_e',
              'itf', 'codabar', 'data_matrix'
            ]
          });

          intervaloEscaneo = setInterval(async () => {
            try {
              const codigos = await detector.detect(video);
              if (codigos.length > 0) {
                procesarCodigoLeido(codigos[0].rawValue);
              }
            } catch (e) {}
          }, 200);
        } else {
          alert('El motor de escaneo no está disponible. Usa ingreso manual.');
        }
      } catch (err) {
        detenerCamara();
        alert('No se pudo activar la cámara. Verifica permisos en Ajustes.');
      }
    }

    function detenerCamara() {
      if (intervaloEscaneo) clearInterval(intervaloEscaneo);
      if (streamCamara) {
        streamCamara.getTracks().forEach(track => track.stop());
        streamCamara = null;
      }
      cambiarPantalla('pantalla-inicio');
    }

    function procesarCodigoLeido(codigoCrudo) {
      if (navigator.vibrate) navigator.vibrate(150);
      emitirBeep();
      detenerCamara();

      const texto = codigoCrudo.trim();
      const partes = texto.split(',');
      let unidadVisual = '';

      if (partes.length >= 3) {
        loteActual = partes[0].trim() || 'N/A';
        materialActual = partes[2].trim() || 'SIN_CODIGO';
        unidadVisual = partes[8] ? partes[8].trim() : '';
      } else {
        materialActual = texto;
        loteActual = 'N/A';
      }

      document.getElementById('texto-material').textContent = materialActual;
      document.getElementById('texto-lote').textContent = loteActual;
      document.getElementById('label-cantidad').textContent = unidadVisual 
        ? `CANTIDAD TOMADA (${unidadVisual})` 
        : 'CANTIDAD TOMADA';

      document.getElementById('input-cantidad').value = '1';
      cambiarPantalla('pantalla-cantidad');
    }

    function ingresoManual() {
      detenerCamara();
      const manual = prompt('Escribe el código de material o lote:');
      if (manual && manual.trim() !== '') {
        procesarCodigoLeido(manual);
      }
    }

    function ajustarCantidad(delta) {
      const input = document.getElementById('input-cantidad');
      let actual = parseFloat(input.value) || 0;
      let nuevo = Math.max(1, actual + delta);
      input.value = nuevo;
    }

    function guardarRegistro() {
      const cantidadVal = parseFloat(document.getElementById('input-cantidad').value);
      if (!materialActual || isNaN(cantidadVal) || cantidadVal <= 0) {
        alert('Ingresa una cantidad válida mayor a 0.');
        return;
      }

      const ahora = new Date();
      const fecha = ahora.toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit', year: 'numeric' });
      const hora = ahora.toLocaleTimeString('es-MX', { hour12: false });

      const registros = obtenerRegistros(STORAGE_KEY);
      registros.push({
        Fecha: fecha,
        Hora: hora,
        Codigo_Material: materialActual,
        Lote_Interno: loteActual,
        Cantidad: cantidadVal
      });

      localStorage.setItem(STORAGE_KEY, JSON.stringify(registros));
      materialActual = '';
      loteActual = '';
      actualizarInterfaz();
      cambiarPantalla('pantalla-inicio');
      mostrarToast('✓ Consumo registrado');
    }

    function abrirModalExportacion(esRespaldo) {
      modoRespaldoActivo = esRespaldo;
      const lista = obtenerRegistros(esRespaldo ? BACKUP_KEY : STORAGE_KEY);
      if (lista.length === 0) return;

      document.getElementById('modal-titulo').textContent = esRespaldo 
        ? 'Reenviar último corte' 
        : 'Guardar corte en OneDrive';

      document.getElementById('modal-mensaje').textContent = esRespaldo
        ? `Se exportarán los ${lista.length} registros del corte anterior.`
        : `Se exportarán ${lista.length} registros y la memoria del celular volverá a 0 para el siguiente turno.`;

      document.getElementById('btn-confirmar-envio').textContent = esRespaldo
        ? 'Exportar Respaldo'
        : 'Exportar y Limpiar Memoria';

      document.getElementById('modal-confirmacion').classList.add('activo');
    }

    function cerrarModal() {
      document.getElementById('modal-confirmacion').classList.remove('activo');
    }

    document.getElementById('btn-confirmar-envio').addEventListener('click', async () => {
      const llaveOrigen = modoRespaldoActivo ? BACKUP_KEY : STORAGE_KEY;
      const registros = obtenerRegistros(llaveOrigen);
      cerrarModal();

      if (registros.length === 0) return;

      const prefijo = modoRespaldoActivo ? 'RESPALDO_Consumo_Lab' : 'Consumo_Lab';
      const { archivo, nombreArchivo } = construirArchivo(registros, prefijo);

      let exportado = false;

      if (navigator.canShare && navigator.canShare({ files: [archivo] })) {
        try {
          await navigator.share({ files: [archivo], title: nombreArchivo });
          exportado = true;
        } catch (err) {
          if (err.name === 'AbortError') return;
        }
      }

      if (!exportado) {
        const url = URL.createObjectURL(archivo);
        const a = document.createElement('a');
        a.href = url;
        a.download = nombreArchivo;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        exportado = true;
        mostrarToast('Descargado: toca la notificación para subir a OneDrive');
      } else {
        mostrarToast('Enviado y memoria limpia');
      }

      if (exportado && !modoRespaldoActivo) {
        localStorage.setItem(BACKUP_KEY, JSON.stringify(registros));
        localStorage.removeItem(STORAGE_KEY);
        actualizarInterfaz();
      }
    });

    function construirArchivo(registros, prefijo) {
      const ahora = new Date();
      const timestamp = `${ahora.getFullYear()}-${String(ahora.getMonth()+1).padStart(2,'0')}-${String(ahora.getDate()).padStart(2,'0')}_${String(ahora.getHours()).padStart(2,'0')}-${String(ahora.getMinutes()).padStart(2,'0')}`;

      if (typeof XLSX !== 'undefined') {
        const nombreArchivo = `${prefijo}_${timestamp}.xlsx`;
        const hoja = XLSX.utils.json_to_sheet(registros);
        const rango = XLSX.utils.decode_range(hoja['!ref']);
        for (let R = 1; R <= rango.e.r; ++R) {
          ['C', 'D'].forEach(col => {
            const celda = hoja[`${col}${R + 1}`];
            if (celda) { celda.t = 's'; celda.z = '@'; }
          });
        }
        const libro = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(libro, hoja, 'Consumos');
        const buffer = XLSX.write(libro, { bookType: 'xlsx', type: 'array' });
        return {
          archivo: new File([buffer], nombreArchivo, { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }),
          nombreArchivo
        };
      } else {
        const nombreArchivo = `${prefijo}_${timestamp}.csv`;
        let csv = '\uFEFFFecha,Hora,Codigo_Material,Lote_Interno,Cantidad\n';
        registros.forEach(r => {
          csv += `${r.Fecha},${r.Hora},"${r.Codigo_Material}","${r.Lote_Interno}",${r.Cantidad}\n`;
        });
        return {
          archivo: new File([csv], nombreArchivo, { type: 'text/csv;charset=utf-8;' }),
          nombreArchivo
        };
      }
    }

    function mostrarToast(texto) {
      const toast = document.getElementById('toast');
      toast.textContent = texto;
      toast.classList.add('visible');
      setTimeout(() => toast.classList.remove('visible'), 2800);
    }

    function emitirBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.12);
      } catch (e) {}
    }
  </script>
</body>
</html>
